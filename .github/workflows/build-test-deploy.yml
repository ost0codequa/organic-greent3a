name: Build Test Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
  OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
  OPENSHIFT_NAMESPACE: organicgreentea-dev

  APP_NAME: webapplication02
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/webapplication02
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ==========================
  # CI - Build and Test
  # ==========================
  build-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore WebApplication02.Tests/WebApplication02.Tests.csproj

      - name: Build application
        run: dotnet build WebApplication02.csproj --no-restore --configuration Release

      - name: Build tests
        run: dotnet build WebApplication02.Tests/WebApplication02.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test WebApplication02.Tests/WebApplication02.Tests.csproj --no-build --configuration Release

  # ==========================
  # CI - Build and Push Image
  # ==========================
  build-image:
    runs-on: ubuntu-latest
    needs: build-test

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


  # ==========================
  # CD - Deploy to OpenShift
  # ==========================
  deploy:
    runs-on: ubuntu-latest
    needs: build-image

    steps:

      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: 4.20

      - name: Login to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
          openshift_token: ${{ env.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      - name: Set OpenShift project
        run: |
          kubectl project ${{ env.OPENSHIFT_NAMESPACE }}

      - name: Update deployment image
        run: |
          kubectl set image deployment/${{ env.APP_NAME }} \
            ${{ env.APP_NAME }}=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.APP_NAME }} --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get deployment/${{ env.APP_NAME }}
          kubectl get pods -l app=${{ env.APP_NAME }}
